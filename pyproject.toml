[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism-agentic"
version = "0.2.0"
description = "PRISM — Persistent Reasoning & Intelligent Self-evolving Multi-agent Framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "PRISM Contributors"},
]
keywords = [
    "multi-agent",
    "self-evolving",
    "ai-agents",
    "mcp",
    "orchestration",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
all = [
    "prism-agentic[llm,dev]",
]

[project.scripts]
prism = "prism.cli.main:main"

[project.urls]
Homepage = "https://github.com/prism-agentic/prism"
Documentation = "https://github.com/prism-agentic/prism#readme"
Repository = "https://github.com/prism-agentic/prism"
Issues = "https://github.com/prism-agentic/prism/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[tool.hatch.build.targets.sdist]
include = [
    "src/prism/",
    "agents/",
    "core/",
    "evolution/",
    "examples/",
    "tests/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
